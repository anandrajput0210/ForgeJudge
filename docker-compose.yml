services:
  db:
    image: postgres:16
    container_name: forgejudge-db
    environment:
      POSTGRES_DB: forgejudge
      POSTGRES_USER: forgejudge
      POSTGRES_PASSWORD: forgejudge
    ports:
      - "5432:5432"
    volumes:
      - forgejudge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejudge -d forgejudge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: forgejudge-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://forgejudge:forgejudge@db:5432/forgejudge
      SECRET_KEY: forgejudge-local-development-secret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    container_name: forgejudge-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  forgejudge_data: